name: Verify demo bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Trust & Life semantic verifier
        working-directory: reference-implementation
        run: npm run verify:demo
