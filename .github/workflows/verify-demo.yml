name: Verify v0.5 field pilot operations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: trust-life-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trust chain, onboarding, conformance, lifecycle, publication and API contracts
        working-directory: reference-implementation
        run: npm run verify
