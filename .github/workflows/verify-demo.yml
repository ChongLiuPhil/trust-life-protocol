name: Verify v0.2 reference implementation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence integrity and trust semantics
        working-directory: reference-implementation
        run: npm run verify
      - name: Smoke-test read-only registry API
        working-directory: reference-implementation
        run: |
          node server.js >/tmp/trust-life-server.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent 'http://127.0.0.1:8080/v1/subjects/tl%3Asubject%3Aapple-2026-0001'
