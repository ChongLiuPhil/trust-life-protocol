openapi: 3.1.0
info:
  title: Trust & Life Read-only Registry API
  version: 0.3.0
  description: >-
    Public lookup, signing-key, credential-status, and federation discovery API.
    Responses expose evidence and trust metadata; they are not safety guarantees.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Service status}
  /.well-known/trust-life-registry:
    get:
      operationId: getRegistryDescriptor
      responses:
        '200': {description: Signed registry descriptor}
  /v1/federation:
    get:
      operationId: getFederation
      responses:
        '200': {description: Local registry and source-preserving peer descriptors}
  /v1/keys:
    get:
      operationId: listPublicKeys
      responses:
        '200': {description: Public signing keys}
  /v1/keys/{keyId}:
    get:
      operationId: getPublicKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Public key descriptor}
        '404': {description: Key not found}
  /v1/credentials/{credentialId}/status:
    get:
      operationId: getCredentialStatus
      parameters:
        - in: path
          name: credentialId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Signed demonstration credential status}
        '404': {description: Credential status not found}
  /v1/subjects:
    get:
      operationId: listSubjects
      responses:
        '200': {description: Public subjects}
  /v1/subjects/{subjectId}:
    get:
      operationId: getSubjectVerification
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Consumer verification view including cryptographic checks}
        '404': {description: Subject not found}
