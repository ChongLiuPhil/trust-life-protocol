openapi: 3.1.0
info:
  title: Trust & Life Read-only Registry API
  version: 0.5.0
  description: >-
    Public lookup, signing-key, credential-status, federation discovery,
    pilot onboarding, explainable conformance assessment, lifecycle state,
    guarded public projection, and QR resolver API. Responses expose scoped
    evidence and trust metadata; they are not legal certification, professional
    audit opinions, purchasing recommendations, or safety guarantees.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Service status}
  /.well-known/trust-life-registry:
    get:
      operationId: getRegistryDescriptor
      responses:
        '200': {description: Signed registry descriptor}
  /v1/federation:
    get:
      operationId: getFederation
      responses:
        '200': {description: Local registry and source-preserving peer descriptors}
  /v1/profiles:
    get:
      operationId: listProfiles
      responses:
        '200': {description: Published machine-readable profiles}
  /v1/profiles/{profileId}:
    get:
      operationId: getProfile
      parameters:
        - in: path
          name: profileId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Exact profile/version rules used by the reference evaluator}
        '404': {description: Profile not found}
  /v1/onboarding:
    get:
      operationId: listOnboardingApplications
      responses:
        '200': {description: Public-safe onboarding application summaries}
  /v1/onboarding/{applicationId}:
    get:
      operationId: getOnboardingApplication
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Public-safe scoped onboarding record; restricted document content is excluded}
        '404': {description: Application not found}
  /v1/onboarding/{applicationId}/assessment:
    get:
      operationId: getOnboardingAssessment
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Explainable requirement-level pilot assessment evaluated against the current demo lifecycle timestamp}
        '404': {description: Assessment not found}
  /v1/pilots:
    get:
      operationId: listPilots
      responses:
        '200': {description: Public-safe field-pilot lifecycle summaries}
  /v1/pilots/{pilotId}:
    get:
      operationId: getPilot
      parameters:
        - in: path
          name: pilotId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Current lifecycle and publication state for a pilot}
        '404': {description: Pilot not found}
  /v1/public-projection/{subjectId}:
    get:
      operationId: getCurrentPublicProjection
      description: >-
        Returns the current public projection only when the subject is within
        the pilot scope, lifecycle state is live, publication is allowed, and
        the current deterministic assessment is ready or ready-with-advisories.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Current lifecycle-gated public Registry projection}
        '404': {description: Subject is unknown or outside the pilot public projection scope}
        '409': {description: Current lifecycle or assessment state blocks publication}
  /v1/keys:
    get:
      operationId: listPublicKeys
      responses:
        '200': {description: Public signing keys}
  /v1/keys/{keyId}:
    get:
      operationId: getPublicKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Public key descriptor}
        '404': {description: Key not found}
  /v1/credentials/{credentialId}/status:
    get:
      operationId: getCredentialStatus
      parameters:
        - in: path
          name: credentialId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Signed demonstration credential status}
        '404': {description: Credential status not found}
  /v1/subjects:
    get:
      operationId: listSubjects
      responses:
        '200': {description: Public subjects with verification and resolver paths}
  /v1/subjects/{subjectId}:
    get:
      operationId: getSubjectVerification
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Consumer verification view including evidence, cryptographic checks, pilot findings, lifecycle, and current publication state}
        '404': {description: Subject not found}
  /v1/subjects/{subjectId}/assessment:
    get:
      operationId: getSubjectAssessment
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Pilot assessment whose declared scope includes the subject}
        '404': {description: Assessment not found}
  /v1/qr/{subjectId}:
    get:
      operationId: getQrTarget
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Portable Trust & Life resolver, verification, and current-public-projection targets for QR use}
        '404': {description: Subject not found}
  /r/{subjectId}:
    get:
      operationId: resolveSubject
      description: >-
        Trust & Life demonstration resolver. The resolver may remain available
        to show a suspension/withdrawal notice even when the current public
        conformance projection is blocked. This path is not itself a GS1
        Digital Link identifier. Operators with properly assigned GS1 keys may
        integrate a GS1-conformant resolver separately.
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: {type: string}
      responses:
        '302': {description: Redirect to the consumer verification view}
        '404': {description: Subject not found}
